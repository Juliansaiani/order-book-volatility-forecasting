[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "orderbook-volatility"
version = "0.1.0"
description = "Order-book features and grouped evaluation for realized volatility forecasting"
readme = "README.md"
license = "CC0-1.0"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3", "pandas>=2.2,<4", "scipy>=1.13,<2",
  "scikit-learn>=1.5,<2", "lightgbm==4.6.0", "pyarrow>=17",
  "matplotlib>=3.9,<4", "joblib>=1.4,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "nbclient>=0.10,<1", "nbformat>=5.10,<6", "ipykernel>=6"]

[project.scripts]
volatility-lab = "orderbook_volatility.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
